<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Nossos Produtos e Redes Sociais</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_produtos.css">
    <link rel="shortcut icon" href="Img/Sub logo.png" type="image/x-icon">
</head>
<body>
    <div class="Conter_as_duas_img">
        <!-- Piloto -->
        <div>
            <img src="Img/bortoleto.avif" alt="piloto" height="250" width="auto">
            <a href="https://www.instagram.com/gabrielbortoleto_/" target="_blank">
                Instagram do Piloto
            </a>
        </div>

        <!-- Instagram -->
        <div>
            <img src="Img/Sub_logo-removebg-preview.png" alt="Nosso instagram" height="250" width="auto">
            <a href="https://www.instagram.com/f1/" target="_blank">
                Nosso Instagram
            </a>
        </div>

        <!-- Camiseta -->
        <div>
            <img src="Img/Camiseta_Sauber-removebg-preview.png" alt="Camiseta Da Sauber Nº5 De Bortoleto" height="250" width="auto">
            <a href="https://www.amazon.com.br/CMC-Motorsports-Camiseta-masculina-Sauber/dp/B0D1Z4PKSG?psc=1" target="_blank">
                Site para Compra
            </a>
        </div>

        <!-- Publicidade -->
        <div>
            <div class="publicidade-bloco">
                <h4>Publicidade</h4>
                <a href="https://bandplay.com/" target="_blank">
                    <img src="Img/Logo do band play.png" alt="Band Play" height="60" width="auto">
                </a>
            </div>
            
            <div class="publicidade-bloco">
                <h4>Publicidade</h4>
                <a href="https://f1tv.formula1.com/" target="_blank">
                    <img src="Img/f1-tv-logo.png" alt="F1 TV" height="40" width="auto">
                </a>
            </div>
        </div>
    </div>

    <!-- Cartão de Visitas - AGORA LOGO ABAIXO DOS CARDS -->
    <div class="cartao-visitas">
        <h2 class="cartao-visitas-titulo">PITZONE</h2>
        <img src="Img/Cartão de visitas quem somos03.png" alt="Cartão de visitas">
    </div>
</body>
</html>
